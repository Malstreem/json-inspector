<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>JSON Inspector</title>
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="toolbar" role="toolbar" aria-label="Main toolbar">
        <div class="toolbar-left">
          <span class="logo" aria-label="JSON Inspector">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>JSON Inspector</span>
          </span>
          <nav class="menu-bar" aria-label="Application menu">
            <button class="menu-btn" type="button">File</button>
            <button class="menu-btn" type="button">View</button>
            <button class="menu-btn" type="button">Tools</button>
          </nav>
        </div>
        <div class="toolbar-center">
          <div class="search-box" role="search">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Search nodes…" aria-label="Search nodes" />
          </div>
        </div>
        <div class="toolbar-right">
          <button class="icon-btn" type="button" id="btn-fit" title="Fit to view" aria-label="Fit graph to view">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
          </button>
          <button class="icon-btn" type="button" id="btn-collapse-all" title="Collapse all" aria-label="Collapse all nodes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
          <button class="icon-btn" type="button" id="btn-expand-all" title="Expand all" aria-label="Expand all nodes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
          <span class="separator"></span>
          <button class="icon-btn" type="button" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="icon-btn" type="button" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <span class="separator"></span>
          <button class="icon-btn" type="button" id="btn-export" title="Export SVG" aria-label="Export graph as SVG">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </header>

      <!-- Main content area -->
      <main class="main-split">
        <!-- Left pane: Editor -->
        <section class="pane editor-pane" aria-label="JSON Editor">
          <div class="pane-header">
            <div class="tab-bar" role="tablist">
              <button class="tab active" role="tab" aria-selected="true" data-tab="json">JSON</button>
              <button class="tab" role="tab" aria-selected="false" data-tab="yaml" disabled>YAML</button>
              <button class="tab" role="tab" aria-selected="false" data-tab="ui-view" disabled>UI View</button>
            </div>
            <div class="pane-actions">
              <button class="text-btn" type="button" id="btn-format" title="Format JSON">Format</button>
              <button class="text-btn" type="button" id="btn-sample" title="Load sample data">Sample</button>
              <button class="text-btn" type="button" id="btn-open" title="Open file">Open</button>
              <input type="file" id="file-input" accept=".json,.jsonl,.geojson" hidden />
            </div>
          </div>
          <div id="editor-container" class="editor-container"></div>
        </section>

        <!-- Resizer handle -->
        <div class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="Resize editor and graph panes" tabindex="0"></div>

        <!-- Right pane: Graph -->
        <section class="pane graph-pane" aria-label="JSON Graph">
          <div class="pane-header graph-header">
            <button class="icon-btn hamburger" type="button" aria-label="Graph options">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="graph-tabs">
              <button class="graph-tab active" data-graph="1">Graph 1</button>
              <button class="graph-tab" data-graph="2" disabled>Graph 2</button>
            </div>
          </div>
          <div id="graph-viewport" class="graph-viewport">
            <svg id="graph-svg" class="graph-svg" xmlns="http://www.w3.org/2000/svg">
              <g id="graph-group"></g>
            </svg>
          </div>
        </section>
      </main>

      <!-- Status bar -->
      <footer class="status-bar" role="status">
        <div class="status-left">
          <span id="status-nodes">Nodes: 0</span>
          <span class="status-sep">|</span>
          <span id="status-parse-time"></span>
        </div>
        <div class="status-right">
          <span id="status-error" class="status-error"></span>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
